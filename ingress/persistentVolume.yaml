kind: PersistentVolume
apiVersion: v1
metadata:
  name: ingress-pv-app1
spec:
  storageClassName: manual
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/app1

