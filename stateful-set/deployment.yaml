kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: stateful-set
  namespace: stateful
spec:
  serviceName: "stateful-set"
  replicas: 3
  selector:
    matchLabels:
      app: stateful-set
  template:
    metadata:
      labels:
        app: stateful-set
    spec:
      containers:
      - name: smongoDb
        image: mongo
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: root
        - name: MONGO_INITDB_DATABASE
          value: mydatabase
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc
