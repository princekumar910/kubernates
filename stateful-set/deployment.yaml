kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: stateful-set
  namespace: stateful
spec:
  serviceName: "mongo-service"
  replicas: 3
  selector:
    matchLabels:
      app: stateful-set
  template:
    metadata:
      labels:
        app: stateful-set
    spec:
      containers:
      - name: mongodb
        image: mongo
        args: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongo-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
